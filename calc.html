<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/ac6bf4de74.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="./calc.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main>
      <div class="calc">
        <p>
          Calculator &nbsp; <i class="fa-solid fa-calculator fa-2xs"></i>
          <span id="histdisply"></span>
        </p>
        <div class="screen">
          <input id="input" type="text" value="" />
          <input id="result" type="text" value="" />
        </div>

        <div class="btns">
          <button class="btn" onclick="historylist()">
            <i class="fa-solid fa-clock-rotate-left fa-2xs"></i>
          </button>
          <button class="btn">X <sup>2</sup></button>
          <button class="btn">x/2</button>
          <button onclick="allclear()" class="funbtn operation">AC</button>

          <button class="btn">%</button>
          <button class="btn">(</button>
          <button class="btn">)</button>
          <button class="btn">/</button>

          <button class="btn">7</button>
          <button class="btn">8</button>
          <button class="btn">9</button>
          <button class="btn operation">*</button>

          <button class="btn">4</button>
          <button class="btn">5</button>
          <button class="btn">6</button>
          <button class="btn operation">-</button>

          <button class="btn">1</button>
          <button class="btn">2</button>
          <button class="btn">3</button>
          <button class="btn operation">+</button>

          <button class="btn">0</button>
          <button class="btn">.</button>
          <button onclick="backspace()" class="funbtn operation">
            <i class="fa-solid fa-delete-left"></i>
          </button>
          <button
            onclick="equal() , savehistory()"
            class="funbtn"
            style="background-color: rgb(35, 35, 243)"
          >
            =
          </button>
        </div>
      </div>

      <div class="history">
        <p>
          History &nbsp; <i class="fa-solid fa-clock-rotate-left fa-2xs"></i>
        </p>

        <div class="showhistory"></div>

        <h3>
          <button onclick="deleteHistory()">
            <i class="fa-solid fa-trash" style="color: #e2e4e9"></i>
          </button>
        </h3>
      </div>
    </main>
  </body>

  <script src="./calc.js"></script>
</html>
